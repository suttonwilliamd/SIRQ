[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sirq"
version = "0.1.0"
description = "Semantic Interrupt Request: semantic sensing with deterministic authority"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "SIRQ contributors"}]
dependencies = []

[project.scripts]
sirq = "sirq.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["sirq*"]
